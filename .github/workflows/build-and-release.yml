name: Build and Release Go Application

on:
  push:
    branches:
      - main
      - 'feat/*'
    tags:
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Build for Linux
      run: GOOS=linux GOARCH=amd64 go build -o gosh-linux-amd64

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: gosh-linux-amd64
        path: gosh-linux-amd64

    - name: Build for Windows
      run: GOOS=windows GOARCH=amd64 go build -o gosh-windows-amd64.exe

    - name: Upload Windows Binary
      uses: actions/upload-artifact@v4
      with:
        name: gosh-windows-amd64
        path: gosh-windows-amd64.exe

    - name: Build for macOS
      run: GOOS=darwin GOARCH=amd64 go build -o gosh-darwin-amd64

    - name: Upload macOS Binary
      uses: actions/upload-artifact@v4
      with:
        name: gosh-darwin-amd64
        path: gosh-darwin-amd64

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only run release job when a tag is pushed
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: gosh-linux-amd64

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: gosh-windows-amd64

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: gosh-darwin-amd64

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Linux Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./gosh-linux-amd64
          asset_name: gosh-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Windows Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./gosh-windows-amd64.exe
          asset_name: gosh-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./gosh-darwin-amd64
          asset_name: gosh-darwin-amd64
          asset_content_type: application/octet-stream
